# Enable underglow
#CONFIG_ZMK_RGB_UNDERGLOW=y
#CONFIG_WS2812_STRIP_SPI=y

# Allow toggling underglow without toggling external power
#CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Enable OLED
CONFIG_ZMK_DISPLAY=y
# Force external power to stay completely active
CONFIG_ZMK_EXT_POWER=y
# Disables early deep sleeping that can halt display driver boot up
CONFIG_ZMK_IDLE_TIMEOUT=3000
# Test Fix on I2C for OLED?
CONFIG_I2C_ZMK_CLOCK_SPEED=100000

# Increase BLE power level
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# I2C for cirque
# CONFIG_I2C=y

# zmk mouse emulation
CONFIG_ZMK_POINTING=y

# for logging, remove later
# CONFIG_ZMK_USB_LOGGING=y

# trying this for problematic BLE on one of my machines
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
